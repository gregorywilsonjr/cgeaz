name: drift-detection

# Detector 1 of 2: does reality still match the code? (Detector 2 is the KQL tripwire —
# who's been touching reality? — scheduled in Log Analytics.)
# terraform plan -detailed-exitcode: 0 = clean, 2 = drift. Drift opens an issue with the diff.

on:
  schedule:
    - cron: "0 8 * * *"   # nightly, after the 05:00 UTC collection sweep
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
  TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
  TF_VAR_deployer_object_id: ${{ vars.DEPLOYER_OBJECT_ID }}

jobs:
  drift:
    # Runs only in forks that have been armed (Lab 6: labs/06-loop/arm-your-fork.sh).
    # The upstream GRCEngClub/cgeaz repo is deliberately NOT armed: on a public repo,
    # a pull_request OIDC subject matches PRs from any fork — arming upstream would
    # hand fork PRs a path toward the course subscription. Your fork, your identity,
    # your sandbox subscription only.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [01-foundation, 02-activation, 03-evidence-store, 04-reporting, 06-enforcement]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          # The wrapper turns Terraform's exit code 2 ("changes found") into 0,
          # which silently disables drift detection. Off everywhere for honest exit codes.
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: plan with detailed exit code
        id: plan
        working-directory: stages/${{ matrix.stage }}
        continue-on-error: true
        run: |
          terraform init -input=false -backend-config="resource_group_name=rg-grc-tfstate" -backend-config="storage_account_name=$TF_VAR_state_storage_account" -backend-config="container_name=tfstate"
          terraform plan -input=false -detailed-exitcode -no-color -out=drift.plan \
            2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: open drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v8
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('stages/${{ matrix.stage }}/plan-output.txt', 'utf8');
            // A plan prints resource tags, and the owner tag holds a real email address.
            // Issues on a public repo are public, so redact it exactly as
            // scripts/capture-evidence.sh does before publishing anything.
            const ownerEmail = process.env.OWNER_EMAIL;
            if (ownerEmail) { body = body.split(ownerEmail).join('<owner>'); }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift detected: stages/${{ matrix.stage }} (${new Date().toISOString().slice(0,10)})`,
              body: 'Reality no longer matches code. This is a change-management finding that generated itself. The owner tag value is redacted to `<owner>`.\n\n```\n' + body.slice(0, 60000) + '\n```',
              labels: ['drift'],
            });

      - name: fail when the detector itself could not run
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: |
          echo "::error::Terraform could not evaluate drift for stages/${{ matrix.stage }} (exit code '${{ steps.plan.outputs.exitcode }}'). The detector is broken; this is not a statement about the environment."
          exit 1

      - name: fail when drift was found
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::Drift detected for stages/${{ matrix.stage }}. This run opened an issue with the plan."
          exit 1
